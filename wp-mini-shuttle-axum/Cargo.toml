[package]
name = "wp-mini-axum"
version = "0.2.0-alpha.1"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.7", features = ["http2"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.12.25", default-features = false, features = ["cookies", "rustls-tls"] }
serde = "1.0.228"
serde_json = "1.0.145"
shuttle-axum = "0.57.0"
shuttle-runtime = "0.57.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6.8", features = ["cors"] }
tracing = "0.1.43"
wp-mini = "0.2.0-alpha.2"
wp-mini-epub = "0.9.0-alpha.1"

[profile.release]
codegen-units = 1

[profile.lto-strip-release]
inherits = "release"
lto = true
strip = true
